<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#151a3d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tide Keeper" />
  <meta name="description" content="Guide Lumi, the last spark of the lighthouse, home across the islands by turning old mirrors." />
  <title>Tide Keeper</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="loading" class="screen show"><div class="spark"></div></div>

  <section id="title" class="screen">
    <div class="title-wrap">
      <p class="eyebrow">a little light's journey</p>
      <h1>Tide<br />Keeper</h1>
      <p class="story">A storm scattered the lighthouse's flame. You are <b>Lumi</b>, its last spark.<br />Turn the old mirrors, guide lost boats, and find your way home.</p>
    </div>
    <div class="title-actions">
      <button id="btn-play" class="btn primary">Play</button>
      <button id="btn-sound-title" class="btn ghost small" aria-label="Toggle sound"></button>
    </div>
  </section>

  <section id="select" class="screen">
    <header class="sheet-head">
      <button class="icon-btn" id="btn-select-back" aria-label="Back">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
      </button>
      <h2>Islands</h2>
      <div class="total-stars" id="total-stars"></div>
    </header>
    <div id="level-grid" class="level-grid"></div>
  </section>

  <section id="hud" class="screen">
    <div class="hud-top">
      <button class="icon-btn" id="btn-menu" aria-label="Islands">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5" /><rect x="14" y="4" width="6" height="6" rx="1.5" /><rect x="4" y="14" width="6" height="6" rx="1.5" /><rect x="14" y="14" width="6" height="6" rx="1.5" /></svg>
      </button>
      <div class="level-name"><span id="hud-num"></span><b id="hud-name"></b></div>
      <button class="icon-btn" id="btn-sound" aria-label="Toggle sound"></button>
    </div>
    <div id="toast" class="toast"></div>
    <div class="hud-bottom">
      <div class="chips">
        <div class="chip" id="chip-moves"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7" /><path d="M20 4v5h-5" /></svg><span id="hud-moves">0</span><small id="hud-par"></small></div>
        <div class="chip" id="chip-boats"><svg viewBox="0 0 24 24"><path d="M3 15h18l-2.5 4.5h-13z" /><path d="M11 3v11M11 4l6 8h-6" /></svg><span id="hud-boats">0/0</span></div>
      </div>
      <div class="actions">
        <button class="icon-btn" id="btn-hint" aria-label="Hint">
          <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4" /><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z" /></svg>
        </button>
        <button class="icon-btn" id="btn-restart" aria-label="Restart">
          <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.7" /><path d="M4 4v5h5" /></svg>
        </button>
      </div>
    </div>
  </section>

  <section id="win" class="screen">
    <div class="card">
      <p class="eyebrow" id="win-eyebrow">Island restored</p>
      <h2 id="win-title">Home at last</h2>
      <div class="stars" id="win-stars">
        <i></i><i></i><i></i>
      </div>
      <ul class="win-stats">
        <li><span>Lumi reached the lighthouse</span><b class="ok">✓</b></li>
        <li><span>Boats guided home</span><b id="win-boats"></b></li>
        <li><span>Moves (par)</span><b id="win-moves"></b></li>
      </ul>
      <div class="card-actions">
        <button class="btn ghost" id="btn-replay">Replay</button>
        <button class="btn primary" id="btn-next">Next island</button>
      </div>
    </div>
  </section>

  <div id="fade"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
